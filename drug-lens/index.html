<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8faf7">
  <meta name="description" content="公的資料・副作用・臨床試験・利益相反を横断して薬の情報を検証するDRUG LENS。">
  <title>DRUG LENS｜薬の評判ではなく、証拠を見る。</title>
  <style>
    :root{color-scheme:light;--paper:#f8faf7;--ink:#102a56;--blue:#215cff;--mint:#1fd2a0}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--paper)}
    .loading{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:var(--paper);transition:opacity .25s ease,visibility .25s ease}
    .loading.hide{opacity:0;visibility:hidden;pointer-events:none}
    .mark{width:56px;height:56px;margin:auto;border:7px solid #dbe7ff;border-top-color:var(--blue);border-right-color:var(--mint);border-radius:50%;animation:spin .8s linear infinite}
    strong{display:block;margin-top:18px;color:var(--ink);font-size:17px;letter-spacing:.16em;text-align:center}
    small{display:block;margin-top:7px;color:#64748b;font-size:11px;text-align:center}
    noscript{position:fixed;inset:0;z-index:3;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);text-align:center}
    noscript a{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:999px;background:var(--blue);color:white;text-decoration:none;font-weight:800}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.mark{animation:none}.loading{transition:none}}
  </style>
</head>
<body>
  <div class="loading" id="loading" aria-live="polite">
    <div><div class="mark" aria-hidden="true"></div><strong>DRUG LENS</strong><small>証拠データを読み込んでいます</small></div>
  </div>
  <iframe
    title="DRUG LENS 薬の証拠検証アプリ"
    src="https://drug-lens-jp.yukihiro19900304.chatgpt.site"
    allow="clipboard-write"
    referrerpolicy="no-referrer"
    loading="eager"
    onload="document.getElementById('loading').classList.add('hide')"
  ></iframe>
  <noscript><div>このアプリにはJavaScriptが必要です。<br><a href="https://drug-lens-jp.yukihiro19900304.chatgpt.site">DRUG LENSを開く</a></div></noscript>
</body>
</html>
